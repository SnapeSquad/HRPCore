# HRPCore Messages (MiniMessage format)
prefix: "<gray>[<gold>HRP</gold><gray>]</gray> "

player:
  join: "<green>Welcome back, <yellow><player_name></yellow>!</green>"
  first_join: "<green>Welcome to the server, <yellow><player_name></yellow>!</green>"

errors:
  no_permission: "<red>You do not have permission to do this!</red>"
  only_players: "<red>Only players can execute this command!</red>"

payday:
  received: "<green>PayDay!</green> You have received <gold>$<amount></gold>. <gray>(Multiplier: <multiplier>x)</gray>"

gui:
  status:
    title: "<blue>Your Status</blue>"
    item_role: "<yellow>Role</yellow>"
    item_talents: "<green>Talents</green>"
    item_bank: "<gold>Bank & Financials</gold>"
    item_medical: "<red>Medical Condition</red>"
    item_jail: "<gray>Legal Status</gray>"
    item_job: "<yellow>Job Information</yellow>"
  role:
    title: "<blue>Role Information</blue>"
  talent:
    title: "<blue>Your Talents</blue>"
  bank:
    title: "<blue>Bank & Credits</blue>"
  common:
    back: "<red>Back</red>"

admin:
  player_not_found: "<red>Player not found or offline!</red>"
  invalid_amount: "<red>Invalid amount!</red>"
  money_updated: "<green>Updated balance for <yellow><player></yellow> to <gold>$<amount></gold>.</green>"
  role_updated: "<green>Updated role for <yellow><player></yellow> to <gold><role></gold>.</green>"
  talent_updated: "<green>Updated talent <yellow><talent></yellow> for <yellow><player></yellow> to level <gold><level></gold>.</green>"
  jailed: "<green>Jailed <yellow><player></yellow> for <gold><time></gold> seconds.</green>"
  released: "<green>Released <yellow><player></yellow> from jail.</green>"
  crime_added: "<green>Added crime <yellow><crime></yellow> to <yellow><player></yellow>.</green>"
  bank_updated: "<green>Updated bank balance for <yellow><player></yellow> to <gold>$<amount></gold>.</green>"
  job:
    usage: "<red>Usage: /hrp admin job <set|clear|info> <player> [job]</red>"
    usage_set: "<red>Usage: /hrp admin job set <player> <job_id></red>"
    invalid_job: "<red>Invalid Job ID.</red>"
    unknown_action: "<red>Unknown job action. Use set, clear, or info.</red>"
    cleared: "<green>Cleared job for <yellow><player></yellow>.</green>"
    set: "<green>Set job for <yellow><player></yellow> to <gold><job></gold>.</green>"
    info:
      header: "<blue>Job Info for <player>:</blue>"
      current: "<gray>Current Job: <gold><job></gold></gray>"
  faction:
    usage: "<red>Usage: /hrp admin faction <set|clear|info> <player> [faction] [rank]</red>"
    usage_set: "<red>Usage: /hrp admin faction set <player> <faction> [rank]</red>"
    invalid_faction: "<red>Invalid Faction ID.</red>"
    unknown_action: "<red>Unknown faction action. Use set, clear, or info.</red>"
    cleared: "<green>Cleared faction for <yellow><player></yellow>.</green>"
    set: "<green>Set faction for <yellow><player></yellow> to <gold><faction></gold> (<gray><rank></gray>).</green>"
    info:
      header: "<blue>Faction Info for <player>:</blue>"
      current: "<gray>Current Faction: <gold><faction></gold> (<gray><rank></gray>)</gray>"
  status_opened: "<green>Opening status GUI for player: <yellow><player></yellow></green>"
